name: Test and Scan

on:
  push:
    branches:
      - main

jobs:
  run_tests:
    strategy:
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/${{matrix.service}}/requirements.txt
      - run: pytest services/${{matrix.service}}