name: Test and Scan

on:
  push:
    branches:
      - main

jobs:
  run_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.serivce}}
        python-version: [3.12, 3.11, 3.8] # ${{matrix.python-version}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}
      - run: pip install -r services/${{matrix.service}}/requirements.txt
      - run: pytest -rA services/${{matrix.service}} > ${{matrix.service}}-${{matrix.python-version}}-test-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{matrix.service}}-${{matrix.python-version}} test report
          path: ${{matrix.service}}-${{matrix.python-version}}-test-report.txt 